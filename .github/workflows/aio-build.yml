name: AIO build

# 发布默认在本地完成（build-aio.cmd 打包 + 手动上传 Release），见 AGENTS.md「发行发布」。
# 本 workflow 只保留手动 workflow_dispatch 备用，push tags 触发已移除。
on:
  workflow_dispatch:
    inputs:
      build_inputs_tag:
        description: Build-inputs release tag
        required: true
        default: build-inputs-v1.2.0
        type: string
      release_tag:
        description: Optional application release tag to publish
        required: false
        default: ''
        type: string

permissions:
  contents: write

# A self-hosted runner shares one work tree and its build caches. Never let two
# builds mutate them at once, and never cancel mid-publish.
concurrency:
  group: aio-build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, aio]
    defaults:
      run:
        working-directory: a
    env:
      BUILD_INPUTS_TAG: ${{ inputs.build_inputs_tag || 'build-inputs-v1.2.0' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
          path: a

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: a/package-lock.json

      - name: Cache Cargo toolchain and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: a/tauri-app
          cache-on-failure: true

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Download or reuse verified build inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-Sha256Hex([string]$Path) {
            $stream = [IO.File]::OpenRead($Path)
            try {
              $sha = [Security.Cryptography.SHA256]::Create()
              try { return (($sha.ComputeHash($stream) | ForEach-Object { $_.ToString('x2') }) -join '') }
              finally { $sha.Dispose() }
            } finally { $stream.Dispose() }
          }
          $repo = Join-Path $env:GITHUB_WORKSPACE 'a'
          $download = Join-Path $repo 'temp\build-inputs\release'
          $extract = Join-Path $repo 'temp\build-inputs\extracted'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'DSHEAC-AIO-build' }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BUILD_INPUTS_TAG" -Headers $headers -TimeoutSec 60
          $zipAsset = $release.assets | Where-Object { $_.name -like 'DSHEAC-AIO-build-inputs-*.zip' } | Select-Object -First 1
          $checksumAsset = $release.assets | Where-Object { $_.name -like 'DSHEAC-AIO-build-inputs-*.zip.sha256' } | Select-Object -First 1
          if (-not $zipAsset -or -not $checksumAsset) { throw 'Build-inputs release assets were not found' }
          $expected = ($zipAsset.digest -replace '^sha256:', '').ToLowerInvariant()
          if (-not $expected) { throw 'Build-inputs asset digest is unavailable' }
          $archive = Join-Path $download $zipAsset.name
          $manifest = Join-Path $extract 'build-inputs-manifest.json'
          $reuse = (Test-Path -LiteralPath $archive) -and (Get-Sha256Hex $archive) -eq $expected -and (Test-Path -LiteralPath $manifest)
          if ($reuse) {
            Write-Host "Reusing verified build inputs for $expected"
          } else {
            $checksum = Join-Path $download $checksumAsset.name
            Invoke-WebRequest -Uri $zipAsset.browser_download_url -OutFile $archive -TimeoutSec 600
            Invoke-WebRequest -Uri $checksumAsset.browser_download_url -OutFile $checksum -TimeoutSec 60
            if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
            & .\scripts\verify-build-inputs.ps1 -Archive $archive -ChecksumFile $checksum -ExtractTo $extract
          }
          $manifestData = Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
          $seed = Join-Path $extract $manifestData.profileSeed.directory
          if (-not (Test-Path -LiteralPath (Join-Path $seed 'profiles\web-desktop\node_modules'))) { throw 'Profile seed is incomplete' }
          "PROFILE_SEED_DIR=$seed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $vendor = Join-Path $repo 'vendor'
          $sourceVendor = Join-Path $extract 'vendor'
          if (Test-Path -LiteralPath $sourceVendor) {
            if (Test-Path -LiteralPath $vendor) { Remove-Item -LiteralPath $vendor -Recurse -Force }
            Copy-Item -LiteralPath $sourceVendor -Destination $vendor -Recurse -Force
          }
          if (-not (Test-Path -LiteralPath (Join-Path $vendor 'node\node.exe'))) { throw 'Bundled Node runtime is missing' }

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix tauri-app ci

      - name: Build installer and portable package
        shell: pwsh
        run: |
          & .\scripts\build-aio-package.ps1 -ProfileSeedDir $env:PROFILE_SEED_DIR
          node .\scripts\verify-dist-fresh.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSHEAC-AIO-build
          path: |
            a/dist/*.exe
            a/dist/*.txt
            a/dist/*.json
            a/dist/portable/*.zip
            a/dist/portable/*.txt
          if-no-files-found: error

      - name: Extract release notes
        if: ${{ env.RELEASE_TAG != '' }}
        shell: pwsh
        run: |
          # 发布说明单一来源：CHANGELOG.md 里该 tag 对应版本的中文段落。
          $tag = $env:RELEASE_TAG.TrimStart('v')
          $text = Get-Content -LiteralPath '.\CHANGELOG.md' -Raw -Encoding UTF8
          $pattern = '(?ms)^## \[' + [regex]::Escape($tag) + '\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)'
          $match = [regex]::Match($text, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md 缺少 $tag 的落版段落，先落版再打 tag" }
          $body = "# DSHEAC AIO v$tag`r`n`r`n" + $match.Groups[1].Value.Trim() + "`r`n"
          $file = Join-Path (Get-Location) 'release-notes.md'
          [IO.File]::WriteAllText($file, $body, (New-Object Text.UTF8Encoding($false)))
          Write-Host "Release notes: $((Get-Item $file).Length) bytes"

      - name: Publish application release
        if: ${{ env.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: DSHEAC AIO ${{ env.RELEASE_TAG }}
          body_path: a/release-notes.md
          files: |
            a/dist/*.exe
            a/dist/portable/*.zip
            a/dist/SHA256SUMS.txt
            a/dist/build-provenance.json
