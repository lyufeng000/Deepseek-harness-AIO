name: AIO build

on:
  workflow_dispatch:
    inputs:
      build_inputs_tag:
        description: Build-inputs release tag
        required: true
        default: build-inputs-v1.2.0
        type: string
      release_tag:
        description: Optional application release tag to publish
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, aio]
    defaults:
      run:
        working-directory: src
    env:
      BUILD_INPUTS_TAG: ${{ inputs.build_inputs_tag || 'build-inputs-v1.2.0' }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Prepare clean build-input directories
        shell: pwsh
        run: |
          foreach ($relative in @('temp\build-inputs\release', 'temp\build-inputs\extracted', 'vendor')) {
            $path = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'src') $relative
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }

      - name: Download and verify build inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = Join-Path $env:GITHUB_WORKSPACE 'src'
          $download = Join-Path $repo 'temp\build-inputs\release'
          $extract = Join-Path $repo 'temp\build-inputs\extracted'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'DSHEAC-AIO-build' }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BUILD_INPUTS_TAG" -Headers $headers -TimeoutSec 60
          $zipAsset = $release.assets | Where-Object { $_.name -like 'DSHEAC-AIO-build-inputs-*.zip' } | Select-Object -First 1
          $checksumAsset = $release.assets | Where-Object { $_.name -like 'DSHEAC-AIO-build-inputs-*.zip.sha256' } | Select-Object -First 1
          if (-not $zipAsset -or -not $checksumAsset) { throw 'Build-inputs release assets were not found' }
          $archive = Join-Path $download $zipAsset.name
          $checksum = Join-Path $download $checksumAsset.name
          Invoke-WebRequest -Uri $zipAsset.browser_download_url -OutFile $archive -TimeoutSec 600
          Invoke-WebRequest -Uri $checksumAsset.browser_download_url -OutFile $checksum -TimeoutSec 60
          & .\scripts\verify-build-inputs.ps1 -Archive $archive -ChecksumFile $checksum -ExtractTo $extract
          $manifest = Get-Content -LiteralPath (Join-Path $extract 'build-inputs-manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $seed = Join-Path $extract $manifest.profileSeed.directory
          Move-Item -LiteralPath (Join-Path $extract 'vendor') -Destination (Join-Path $repo 'vendor')
          "PROFILE_SEED_DIR=$seed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix tauri-app ci

      - name: Build installer and portable package
        shell: pwsh
        run: |
          & .\scripts\build-aio-package.ps1 -ProfileSeedDir $env:PROFILE_SEED_DIR
          node .\scripts\verify-dist-fresh.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSHEAC-AIO-build
          path: |
            src/dist/*.exe
            src/dist/*.txt
            src/dist/portable/*.zip
            src/dist/portable/*.txt
          if-no-files-found: error

      - name: Publish application release
        if: ${{ env.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: DSHEAC AIO ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            src/dist/*.exe
            src/dist/portable/*.zip
            src/dist/SHA256SUMS.txt
            src/dist/portable/SHA256SUMS.txt
